<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="keywords" content="project, example">
        <meta name="author" content="Hussam Rabaa">
        <title>Project menu page Example</title>
        <!--google fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
        <!--stylesheet-->
        <link rel="stylesheet" href="styles/styles.css">
        <!--font awesome-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" 
        integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script src="scripts/scripts.js" defer></script>
    </head>

    <body>
        <!--overlay for mobile-->
        <div id="overlay">
            <div>
                <i class="fa fa-times" title="close button" onclick="off()"></i>
            </div>
            <div class="overlay-text">
                    <a href="index.html">Home</a>
                    <a href="menu.html">Menu</a>
                    <a href="about.html">About</a>
                    <a href="login.html">Login</a>

            </div>
        </div>
        <header>
            <nav class="nav full-nav">
                <div>
                    <img src="images/logo-removebg-preview.png" alt="logo" style="width: 18%;">
                </div>
                <div>
                    <a href="index.html">Home</a>
                    <a href="menu.html">Menu</a>
                    <a href="about.html">About</a>
                    <a href="login.html">Login</a>

                </div>
            </nav>
            <!--mobile nav-->
            <nav class="nav mobile-nav">
                <div>
                    <img src="images/logo-removebg-preview.png" 
                    alt="logo" style="width: 25%;" load="lazy">
                </div>
                <div>
                    <i class="fa-solid fa-bars" title="button.to.open.navigation" onclick="on()"></i>
                </div>
            </nav>
        </header>

    <main>
        <div class="hero-container">
            <div class="red-spacer"></div>
        </div>
       
        <!-- add food item form -->
         <div class="add-food">
            <h1>Add Food Item</h1>
            <form>
                <div class="add-form">
                    <div class="food-photo">
                        <label for="photo">Add Photo:</label>
                        <input type="file" id="photo" accept="image/*">
                    </div>

                    <div class="food-name">
                        <label for="name"> Name:</label>
                        <input type="text" id="name" maxlength="20" placeholder="Food Name">
                    </div>

                    <div class="food-type">
                        <label for="type">Type:</label>
                        <select id="type-list" name="type-list" >
                            <option>~Select Type~</option>
                            <option>Burger</option>
                            <option>Juice</option>
                            <option>Kebab</option>
                            <option>Sandwitch</option>
                            <option>Milk Shake</option>
                        </select>
                    </div>

                    <div class="food-price">
                        <lable for="price">Price: SAR</lable>
                        <input type="number" id="price" placeholder="0.0">
                    </div>

                    <div class="food-desc">
                        <label for="description">Description:</label>
                        <textarea id="description" name="description">Enter Description</textarea>
                    </div>

                    <button class="save">
                        <a href="admin.html">Save</a>
                    </button>
                </div>
               
            </form>

            

         </div>

    </main>

    <footer class="footer">
        <div>
            <img src="images/logo-removebg-preview.png" alt="logo" style="width: 13%;" loading="lazy">
        </div>
        <div>
            <div>
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="about.html">About</a>
                <a href="login.html">Login</a>

            </div>
            <div>
                <h4>Rights Reserved</h4>
            </div>
        </div>
        <div>
            <img src="images/insta.png" alt="other logo" style="width: 5%;" loading="lazy">
            <img src="images/facebook.png" alt="other logo" style="width: 5%;" loading="lazy">
            <img src="images/tiktok.png" alt="other logo" style="width: 5%;" loading="lazy">
            <img src="images/whatsapp.png" alt="other logo" style="width: 5%;" loading="lazy">
        </div>
    </footer>
    </body>

</html>
